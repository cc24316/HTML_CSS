<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Menu e Layout</title>
    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        nav ul {
            list-style: none;
            /* tira as bolinhas */
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            color: black;
            text-decoration: none;
            padding: 2px 10px;
        }

        #logo {
            width: 30px;
            height: 30px;
        }

        /* #logo, nav{
            float: left;
        }*/

        #banner {
            background-color: rgb(77, 76, 76);
            text-align: center;
        }

        #banner h1 {
            color: white;
        }

        #banner h2 {
            color: rgb(246, 219, 8);
        }

        footer {
            background-color: black;
            color: white;
        }

        .assunto {
            width: 200px;
            height: 200px;
            background-color: rgb(205, 245, 245);
            text-align: center;
            margin: 5px;
        }

        #conteudo{
            display: flex;
        }
    </style>
</head>

<body>
    <header>
        <img id="logo" src="imagens/logo_cotuca.jpg">
        <nav>
            <ul>
                <li><a href="#">Tutoriais</a></li>
                <li><a href="#">Exercícios</a></li>
                <li><a href="#">Serviços</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="banner">
            <h1>Learn to Code</h1>
            <h2> With the world´s lasgest web developer site.</h2>
        </div>

        <div id="conteudo">
            <div id="assunto1" class="assunto">
                <h2> PHP</h2>
                <p>A web server programming language</p>
                <button>Learn PHP</button>
            </div>

            <div id="assunto2" class="assunto">
                <h2> jQuery</h2>
                <p>A JS library for developing web pages.</p>
                <button>Learn jQuery</button>
            </div>

            <div id="assunto3" class="assunto">
                <h2> Java</h2>
                <p>A programming language</p>
                <button>Learn Java</button>
            </div>
            <div id="assunto4" class="assunto">
                <h2> C++</h2>
                <p>A programming language</p>
                <button>Learn C++</button>
            </div>
        </div>




    </main>
    <footer>
        <h3>Sobre nós...</h3>
        <p>Somos um grupo muito dedicado...</p>
    </footer>
</body>

</html>
