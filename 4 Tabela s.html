<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table, tr, td, th {
            border: 1px solid black;
            border-collapse: collapse;
            margin-bottom: 20px;
            padding: 10px;
        }

        table{
            margin-bottom: 20px;
        }

        #tblNome{
            font-family: Arial, Helvetica, sans-serif;
            width: 300px;
            height: 300px;
            text-align: center;
        
        }

        #tblNome tr:hover {
            background-color: black;
            color: white;
        }

        #tblNome td{
            vertical-align: bottom;
        }

        #tblTimes{
            border-top: 3px dotted purple;
            border-left: 5px dashed green;
        }
    </style>
</head>
<body>
    <table>
        <tr> <!-- linha -->
            <td> 1ª coluna </td>
            <td> 2ª coluna </td>
        </tr>
        <tr>
            <td> 1ª coluna </td>
            <td> 2ª coluna </td>
        </tr>
    </table>

    <table id="tblNome">
        <tr>
            <th>Nome</th>
            <th>Idade</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>17</td>
        </tr>
        <tr>
            <td>Cláudio</td>
            <td>16</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>18</td>
        </tr>
    </table>
    <!-- tabela com colspan -->
    <table id="tblTimes">
        <tr>
            <th>Times</th>
            <th colspan="3">Últimos Títulos</th>
        </tr>
        <tr>
            <td>Palmeiras</td>
            <td>2023</td>
            <td>2022</td>
            <td>2018</td>
        </tr>
        <tr>
            <td>Corinthians</td>
            <td>2021</td>
            <td>2019</td>
            <td>2017</td>
        </tr>
        <tr>
            <td>São Paulo</td>
            <td>2020</td>
            <td>2017</td>
            <td>2015</td>
        </tr>
    </table>
    <!-- tabela com rowspan-->
    <table>
        <tr>
            <th colspan="2">Regiões</th>
        </tr>
        <tr>
            <th rowspan="3">Sul</th>
            <td>Paraná</td>
        </tr>
        <tr>
            <td>Santa Catarina</td>
        </tr>
        <tr>
            <td>Rio Grande do Sul</td>
        </tr>
        <tr>
            <th rowspan="4">Sudeste</th>
            <td>São Paulo</td>
        </tr>
        <tr>
            <td>Rio de Janeiro</td>
        </tr>
        <tr>
            <td>Espírito Santo</td>
        </tr>
        <tr>
            <td>Minas Gerais</td>
        </tr>
    </table>
</body>
</html>
