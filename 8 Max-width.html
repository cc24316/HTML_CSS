<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            padding: 10px;
            margin-bottom: 10px;
        }
        #teste1{
            background-color: cadetblue;
            width: 500px;
        }
        #teste2{
            background-color: rosybrown;
            max-width: 500px;
        }
        span{
            font-weight:bold ;
        }
    </style>
</head>
<body>
    <h1>Exemplo da propriedade MAX_WIDTH</h1>
    <div id="teste1">
        Exemplo com a propriedade <strong>width</strong> do CSS definida com 300px de largura.
    </div>
    <div id="teste2">
        Exemplo com a propriedade <span>max-width</span> do CSS definida com 300px de largura.
    </div>

</body>
</html>
